name: Build MazenmiX TV Fast Sync APK

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/build-mazenmix-tv.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mazenmix-tv-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout MazenmiX TV builder
        uses: actions/checkout@v4

      - name: Checkout exact StreamVault 1.0.16 source
        shell: bash
        run: |
          set -euo pipefail
          git config --global http.version HTTP/1.1
          for attempt in 1 2 3 4; do
            rm -rf StreamVault-src
            git init StreamVault-src
            git -C StreamVault-src remote add origin https://github.com/Davidona/StreamVault-IPTV.git
            if git -C StreamVault-src fetch --depth=1 origin 593333714c43cb1802e14a1452cd9f5906e0a286; then
              git -C StreamVault-src checkout --detach FETCH_HEAD
              break
            fi
            if [ "$attempt" = 4 ]; then
              echo "Unable to fetch pinned 1.0.16 source after 4 attempts"
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply MazenmiX TV patch
        shell: bash
        run: |
          set -o pipefail
          (
            set -euo pipefail
            python3 scripts/patch_mazenmix_tv.py StreamVault-src
            python3 scripts/fix_identity.py StreamVault-src
            grep -n 'applicationId = "com.streamvault.app"' StreamVault-src/app/build.gradle.kts
            if grep -q 'applicationIdSuffix = ".debug"' StreamVault-src/app/build.gradle.kts; then
              echo "ERROR: .debug package suffix still present"
              exit 1
            fi
          ) 2>&1 | tee patch.log

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          (
            set -euo pipefail
            cd StreamVault-src
            chmod +x gradlew
            ./gradlew --console=plain :app:assembleDebug
          ) 2>&1 | tee build.log

      - name: Package APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find StreamVault-src/app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" "MazenmiX-TV-FastSync-Roomy.apk"
          sha256sum "MazenmiX-TV-FastSync-Roomy.apk" > "MazenmiX-TV-FastSync-Roomy.apk.sha256"

      - name: Publish latest APK to repository
        shell: bash
        run: |
          set -euo pipefail
          cp "MazenmiX-TV-FastSync-Roomy.apk" "MazenmiX TV.apk"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "MazenmiX TV.apk"
          if ! git diff --cached --quiet; then
            git commit -m "Build phone settings and unlimited servers APK [skip ci]"
            git push origin HEAD:main
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MazenmiX-TV-FastSync-Roomy
          path: |
            MazenmiX-TV-FastSync-Roomy.apk
            MazenmiX-TV-FastSync-Roomy.apk.sha256
          if-no-files-found: error

      - name: Publish build diagnostics
        if: always()
        shell: bash
        run: |
          {
            echo "workflow_commit=${{ github.sha }}"
            echo "job_status=${{ job.status }}"
            echo
            echo "===== PATCH LOG ====="
            if [ -f patch.log ]; then tail -n 500 patch.log; else echo "patch.log unavailable"; fi
            echo
            echo "===== BUILD LOG ====="
            if [ -f build.log ]; then tail -n 1000 build.log; else echo "build.log unavailable"; fi
          } > build-diagnostics.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add build-diagnostics.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record Android build diagnostics [skip ci]"
            git push origin HEAD:main
          fi
